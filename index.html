@media(min-width:700px){.page{padding-top:25px}.bottom-nav{left:50%;right:auto;width:520px;transform:translateX(-50%);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0}.drawer{width:350px}.stats-grid{gap:12px}}

  <div class="drawer-head">
    <div>
      <strong>XÁC MINH HOÀN THÀNH CÔNG VIỆC</strong>

  <button data-route="calendar">▣<span>Lịch</span></button>
  <button data-route="stats">⌁<span>Thống kê</span></button>

<template id="shiftFormTemplate">
  <form id="shiftForm" class="form-grid">
    <input type="hidden" id="shiftId">
    <label>Tên công việc *
      <input id="jobName" required maxlength="120" placeholder="Ví dụ: Phục vụ ca tối">
    </label>
    <label>Vị trí làm việc *
      <select id="position" required></select>
    </label>
    <button type="button" id="addPositionInline" class="link-btn">＋ Thêm vị trí mới</button>
    <div class="two-col">
      <label>Ngày *
        <input id="date" type="date" required>
      </label>
      <label class="switch-label">OFF
        <input id="off" type="checkbox">
        <span class="switch"></span>
      </label>
    </div>
    <div class="two-col">
      <label>Giờ vào
        <input id="start" type="time" step="60">
      </label>
      <label>Giờ ra
        <input id="end" type="time" step="60">
      </label>
    </div>
    <section class="wage-box">
      <div class="section-title">Mức lương / giờ (VNĐ)</div>
      <div class="wage-select-row">
        <label style="margin:0">Chọn mức đã lưu
          <select id="savedWage"><option value="">-- Chọn mức đã lưu --</option></select>
        </label>
        <button type="button" id="manageWages" class="secondary-btn mini">⚙️ Quản lý</button>
      </div>
      <label style="margin-top:8px">Mức lương đang dùng
        <input id="hourlyRate" type="number" min="0" step="100" inputmode="numeric">
      </label>
      <div class="wage-actions">
        <button type="button" id="saveCurrentWage" class="primary-btn mini">💾 Lưu mức lương này</button>
      </div>
      <div id="wageManager" class="hidden">
        <div class="notice" style="margin-top:8px">💰 Mức lương đã lưu — chọn nhanh khi thêm/sửa ca.</div>
        <div id="wageList" class="wage-list"></div>
        <button type="button" id="addWage" class="primary-btn mini" style="margin-top:8px">＋ Thêm mức lương</button>
      </div>
    </section>
    <section>
      <div class="section-title">Phí cộng thêm</div>
      <div id="extras" class="extras"></div>
      <button type="button" id="addExtra" class="secondary-btn">＋ Thêm phụ cấp / Ship / thưởng</button>
    </section>
    <label>Ghi chú
      <textarea id="note" rows="3" placeholder="Ghi chú cho ca này"></textarea>
    </label>
    <div class="two-col">
      <div class="photo-field">
        <label>📸 Ảnh đầu ca</label>
        <div class="photo-actions">
          <button type="button" class="secondary-btn mini" data-photo-camera="start">📷 Chụp ảnh</button>
          <button type="button" class="secondary-btn mini" data-photo-album="start">🖼️ Chọn từ album</button>
        </div>
        <input id="photoStartCamera" class="photo-input-hidden" type="file" accept="image/*" capture="environment">
        <input id="photoStartAlbum" class="photo-input-hidden" type="file" accept="image/*">
        <div id="photoStartPreview" class="photo-preview"></div><small class="table-sub">Ảnh sẽ được nén để lưu và đồng bộ.</small>
      </div>
      <div class="photo-field">
        <label>📸 Ảnh cuối ca</label>
        <div class="photo-actions">
          <button type="button" class="secondary-btn mini" data-photo-camera="end">📷 Chụp ảnh</button>
          <button type="button" class="secondary-btn mini" data-photo-album="end">🖼️ Chọn từ album</button>
        </div>
        <input id="photoEndCamera" class="photo-input-hidden" type="file" accept="image/*" capture="environment">
        <input id="photoEndAlbum" class="photo-input-hidden" type="file" accept="image/*">
        <div id="photoEndPreview" class="photo-preview"></div><small class="table-sub">Có thể thay ảnh hoặc bấm × để xóa.</small>
      </div>
    </div>
    <div id="shiftPreview" class="calc-box"></div>
    <div class="form-actions">
      <button type="button" class="secondary-btn" data-action="cancel">Hủy</button>
      <button class="primary-btn" type="submit">Lưu ca</button>
    </div>
  </form>
</template>

<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>

<script>
(() => {
"use strict";

const KEY = "xmhtcv.v2";
const DEFAULT_POSITIONS = ["Phục vụ","Pha chế","Thu ngân","Bếp","Khác"];
const FIREBASE_CONFIG = window.XM_FIREBASE_CONFIG || {};
let cloud = null;
let auth = null;
let firestore = null;
let currentUser = null;
let cloudSyncing = false;
let activeLocalKey = "guest";

const MENU = [
  ["dashboard","⌂","Trang tổng quan","Tổng ca / tổng giờ / thu nhập"],
  ["calendar","▣","Lịch tháng","Xem ca theo ngày"],
  ["add","＋","Thêm ca","Tạo ca làm mới"],
  ["stats","⌁","Thống kê","Ngày / tuần / tháng / công việc / vị trí"],
  ["positions","⌖","Vị trí làm việc","Thêm / đổi tên / xóa"],
  ["data","▤","Dữ liệu","Lưu máy, xuất PDF, sao lưu / nhập"],
  ["github","◉","Mở app GitHub","Mở trang GitHub chấm công"],
  ["account","♙","Tài khoản","Tạo tài khoản / đăng nhập / đăng xuất / đồng bộ"],
];

const state = {
  route: ["dashboard","calendar","add","stats","positions","data","github","account","menu","edit","photo"].includes(location.hash.replace("#","")) ? location.hash.replace("#","") : "dashboard",
  month: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
  selectedDate: todayISO(),
  statsPeriod: "month",
  editingId: null
};

let db = loadDB("guest");
let tempPhotos = {start:null,end:null};

function localKeyFor(uid="guest"){ return `${KEY}.${uid || "guest"}`; }
function emptyDB(){ return {positions:DEFAULT_POSITIONS.slice(), shifts:[], wageRates:[], account:null}; }
function normalizeShift(s){
  const x={...s};
  // Dữ liệu cũ chưa có cờ hoàn thành: giữ nguyên là đã hoàn thành để không làm mất thu nhập cũ.
  if(typeof x.completed!=="boolean") x.completed=true;
  return x;
}
function loadDB(uid="guest"){
  try{
    const raw=localStorage.getItem(localKeyFor(uid));
    if(raw){
      const x=JSON.parse(raw);
      return {
        positions:x.positions?.length?x.positions:DEFAULT_POSITIONS.slice(),
        shifts:Array.isArray(x.shifts)?x.shifts.map(normalizeShift):[],
        wageRates:Array.isArray(x.wageRates)?x.wageRates:[],
        account:x.account||null
      };
    }
  }catch(e){ console.warn("loadDB",e); }
  return emptyDB();
}
function saveDB(){ localStorage.setItem(localKeyFor(activeLocalKey), JSON.stringify(db)); }
function saveDBFor(uid, value){ localStorage.setItem(localKeyFor(uid), JSON.stringify(value)); }

function initFirebase(){
  if(!window.firebase || !FIREBASE_CONFIG?.apiKey || String(FIREBASE_CONFIG.apiKey).startsWith("PASTE_")){
    console.warn("Firebase chưa được cấu hình. App vẫn chạy local.");
    return false;
  }
  try{
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    cloud = firebase.app();
    auth = firebase.auth();
    firestore = firebase.firestore();
    return true;
  }catch(e){ console.error("Firebase init",e); return false; }
}
function localShiftToCloud(s){
  return {
    id:s.id,jobName:s.jobName||"",position:s.position||"",date:s.date||null,start:s.start||null,end:s.end||null,
    hourlyRate:Number(s.hourlyRate)||0,extras:Array.isArray(s.extras)?s.extras:[],note:s.note||"",
    off:!!s.off,completed:s.completed!==false,photoStart:s.photoStart||null,photoEnd:s.photoEnd||null,
    updated_at:s.updated_at||new Date().toISOString()
  };
}
function cloudShiftToLocal(s){
  return {id:s.id,jobName:s.jobName||"",position:s.position||"",date:s.date||"",start:s.start||"",end:s.end||"",
    hourlyRate:Number(s.hourlyRate)||0,extras:Array.isArray(s.extras)?s.extras:[],note:s.note||"",
    off:!!s.off,completed:s.completed!==false,photoStart:s.photoStart||null,photoEnd:s.photoEnd||null,updated_at:s.updated_at||new Date().toISOString()};
}
function userShiftRef(id){ return firestore.collection("users").doc(currentUser.uid).collection("shifts").doc(id); }
function userSettingsRef(){ return firestore.collection("users").doc(currentUser.uid).collection("settings").doc("profile"); }

async function syncLocalToCloud(showToast=true){
  if(!firestore||!currentUser||cloudSyncing)return false;
  cloudSyncing=true;
  try{
    // Firestore batch tối đa 500 thao tác; chia nhỏ để không lỗi khi có nhiều ca.
    const writes=db.shifts.map(s=>localShiftToCloud(s));
    for(let i=0;i<writes.length;i+=400){
      const batch=firestore.batch();
      writes.slice(i,i+400).forEach(s=>batch.set(userShiftRef(s.id),s,{merge:true}));
      await batch.commit();
    }
    await userSettingsRef().set({positions:db.positions,wageRates:db.wageRates||[],updated_at:new Date().toISOString()},{merge:true});
    if(showToast) toast("☁️ Đã đồng bộ lên Firebase.");
    return true;
  }catch(e){
    console.error("Firebase sync",e);
    if(showToast) toast("Đã lưu trên máy nhưng đồng bộ Firebase chưa hoàn tất.");
    return false;
  }finally{ cloudSyncing=false; }
}

async function loadCloudForUser(user){
  if(!firestore||!user)return;
  try{
    activeLocalKey=user.uid;
    const userLocal=loadDB(user.uid);
    const guest=loadDB("guest");
    if(!userLocal.shifts.length && guest.shifts.length){ db=guest; saveDB(); }
    else db=userLocal;

    const snap=await firestore.collection("users").doc(user.uid).collection("shifts").get();
    let settingsData={};
    try{
      const settingsSnap=await userSettingsRef().get();
      if(settingsSnap.exists) settingsData=settingsSnap.data()||{};
    }catch(settingsErr){ console.warn("Firebase settings load",settingsErr); }

    const remote=(snap.docs||[]).map(d=>cloudShiftToLocal({...d.data(),id:d.id}));
    const localMap=new Map(db.shifts.map(s=>[s.id,normalizeShift(s)]));
    const remoteMap=new Map(remote.map(s=>[s.id,normalizeShift(s)]));
    const merged=new Map();
    for(const [id,s] of localMap){
      const r=remoteMap.get(id);
      if(!r) merged.set(id,s);
      else merged.set(id,new Date(r.updated_at||0)>=new Date(s.updated_at||0)?r:s);
    }
    for(const [id,s] of remoteMap) if(!merged.has(id)) merged.set(id,s);
    db.shifts=[...merged.values()];
    if(Array.isArray(settingsData.positions)&&settingsData.positions.length) db.positions=settingsData.positions;
    if(Array.isArray(settingsData.wageRates)) db.wageRates=settingsData.wageRates;
    db.account={email:user.email||"",uid:user.uid};
    saveDB();

    // Nếu cloud chưa có dữ liệu, đẩy dữ liệu hiện có lên cloud.
    if(!snap.size || !Object.keys(settingsData).length) await syncLocalToCloud(false);
    if(guest.shifts.length && activeLocalKey===user.uid) localStorage.removeItem(localKeyFor("guest"));
    toast("☁️ Đã đăng nhập và đồng bộ dữ liệu.");
    render();
  }catch(e){
    console.error("Firebase load",e);
    const msg=e?.code?` (${e.code})`:"";
    toast("Đã đăng nhập nhưng chưa tải được dữ liệu Firebase"+msg+".");
  }
}

async function initCloud(){
  if(!initFirebase()) return;
  auth.onAuthStateChanged(async user=>{
    currentUser=user||null;
    if(user) await loadCloudForUser(user);
    else {
      activeLocalKey="guest";
      db=loadDB("guest");
      render();
    }
  });
}

function todayISO(d=new Date()){
  const x = new Date(d.getTime()-d.getTimezoneOffset()*60000);
  return x.toISOString().slice(0,10);
}
function uid(){ return crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2); }
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function money(n){return new Intl.NumberFormat("vi-VN").format(Math.round(Number(n)||0))+"đ";}
function hoursFor(s){
  if(!s || s.off || !s.start || !s.end) return 0;
  const [sh,sm]=s.start.split(":").map(Number), [eh,em]=s.end.split(":").map(Number);
  let a=sh*60+sm,b=eh*60+em;if(b<a)b+=1440;
  return Math.max(0,(b-a)/60);
}
function totalExtra(s){return (s.extras||[]).reduce((a,x)=>a+(Number(x.amount)||0),0);}
function shiftGrossPay(s){return s.off?0:hoursFor(s)*(Number(s.hourlyRate)||0)+totalExtra(s);}
function shiftPay(s){return s.off||s.completed===false?0:shiftGrossPay(s);}
function fmtHours(h){return Number.isInteger(h)?h.toString():h.toFixed(2).replace(/0+$/,"").replace(/\.$/,"");}
function monthLabel(d){return d.toLocaleDateString("vi-VN",{month:"long",year:"numeric"}).replace(/^./,c=>c.toUpperCase());}
function startOfWeek(d){const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x;}
function endOfWeek(d){const x=startOfWeek(d);x.setDate(x.getDate()+6);return x;}
function between(date,a,b){return date>=todayISO(a)&&date<=todayISO(b);}
function shiftsForDate(date){return db.shifts.filter(s=>s.date===date);}
function hasOverlap(candidate){
  if(candidate.off || !candidate.start || !candidate.end) return [];
  const cStart = mins(candidate.start), cEnd = mins(candidate.end)+(mins(candidate.end)<mins(candidate.start)?1440:0);
  return db.shifts.filter(s=>{
    if(s.id===candidate.id || s.date!==candidate.date || s.off || !s.start || !s.end)return false;
    let a=mins(s.start),b=mins(s.end)+(mins(s.end)<mins(s.start)?1440:0);
    return cStart<b && a<cEnd;
  });
}
function mins(t){const [h,m]=t.split(":").map(Number);return h*60+m;}
function toast(msg){const el=document.querySelector("#toast");el.textContent=msg;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),2600);}

function periodShifts(period){
  const now=new Date();
  let a,b;
  if(period==="day"){a=b=new Date(state.selectedDate+"T12:00:00");}
  else if(period==="week"){a=startOfWeek(new Date(state.selectedDate+"T12:00:00"));b=endOfWeek(a);}
  else {a=new Date(now.getFullYear(),now.getMonth(),1);b=new Date(now.getFullYear(),now.getMonth()+1,0);}
  return db.shifts.filter(s=>between(s.date,a,b));
}
function summary(list){
  return {count:list.length,hours:list.reduce((a,s)=>a+hoursFor(s),0),income:list.reduce((a,s)=>a+shiftPay(s),0)};
}

function calendarView(){

function readImage(file,which){
  if(!file)return;
  if(!file.type.startsWith("image/"))return toast("Chỉ nhận file ảnh.");
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=1280, scale=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      let quality=.72, data=c.toDataURL("image/jpeg",quality);
      while(data.length>520000 && quality>.38){quality-=.06;data=c.toDataURL("image/jpeg",quality);}
      if(data.length>650000)return toast("Ảnh vẫn quá lớn. Hãy chọn ảnh khác.");
      tempPhotos[which]=data;renderPhotoPreviews();
    };
    img.src=r.result;
  };
  r.readAsDataURL(file);
}

async function printPDF(){
  const shifts=[...(db.shifts||[])];
  if(!shifts.length)return toast("Chưa có dữ liệu để xuất.");

  const jobInput=prompt("Nhập tên công việc muốn xuất:\n\nVí dụ: Lani, CD, Phục vụ...");
  if(jobInput===null)return;
  const job=jobInput.trim().toLocaleLowerCase("vi-VN");
  if(!job)return toast("Vui lòng nhập tên công việc.");

  let list=shifts.filter(s=>String(s.jobName||"").toLocaleLowerCase("vi-VN").includes(job));
  if(!list.length)return toast("Không tìm thấy công việc này.");

  const period=prompt("Chọn phạm vi xuất dữ liệu:\n\n1 = Ngày\n2 = Tuần\n3 = Tháng\n\nNhập 1, 2 hoặc 3:");
  if(period===null)return;
  let fromDate=null,toDate=null;
  if(period==="1"){
    const date=prompt("Nhập ngày muốn xuất theo dạng YYYY-MM-DD\nVí dụ: 2026-10-04");
    if(!date)return;
    fromDate=date;toDate=date;
  }else if(period==="2"){
    const date=prompt("Nhập ngày bắt đầu tuần theo dạng YYYY-MM-DD\nVí dụ: 2026-10-04");
    if(!date)return;
    const startDate=new Date(date+"T12:00:00");
    if(isNaN(startDate.getTime()))return toast("Ngày không hợp lệ.");
    const endDate=new Date(startDate);endDate.setDate(endDate.getDate()+6);
    fromDate=startDate.toISOString().slice(0,10);toDate=endDate.toISOString().slice(0,10);
  }else if(period==="3"){
    const month=prompt("Nhập tháng muốn xuất theo dạng YYYY-MM\nVí dụ: 2026-10");
    if(!month)return;
    const d=new Date(month+"-01T12:00:00");
    if(isNaN(d.getTime()))return toast("Tháng không hợp lệ.");
    fromDate=month+"-01";d.setMonth(d.getMonth()+1);d.setDate(0);toDate=d.toISOString().slice(0,10);
  }else return toast("Vui lòng chọn 1, 2 hoặc 3.");

  list=list.filter(s=>{const date=String(s.date||"").slice(0,10);return date>=fromDate&&date<=toDate;});
  if(!list.length)return toast("Không có dữ liệu của công việc này trong khoảng thời gian đã chọn.");
  list.sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));

  const escPdf=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const totalHours=list.reduce((sum,s)=>sum+hoursFor(s),0);
  const totalExtraAmount=list.reduce((sum,s)=>sum+totalExtra(s),0);
  const totalBase=list.reduce((sum,s)=>sum+(s.off?0:hoursFor(s)*(Number(s.hourlyRate)||0)),0);
  const totalActual=list.reduce((sum,s)=>sum+shiftPay(s),0);

  const rows=list.map((s,i)=>{
    const base=s.off?0:hoursFor(s)*(Number(s.hourlyRate)||0);
    const extraNames=(s.extras||[]).filter(x=>Number(x.amount)||x.name).map(x=>`${escPdf(x.name)}: ${money(x.amount)}`).join("<br>")||"—";
    const status=s.off?"OFF":(s.completed!==false?"Đã hoàn thành":"Chưa hoàn thành");
    return `<tr><td>${i+1}</td><td>${escPdf(s.date)}</td><td><b>${escPdf(s.jobName)}</b><small>${escPdf(s.position)}</small></td><td>${status}</td><td>${s.off?"OFF":`${escPdf(s.start||"--")} – ${escPdf(s.end||"--")}`}</td><td>${s.off?"0":fmtHours(hoursFor(s))+"h"}</td><td>${money(s.hourlyRate||0)}</td><td>${extraNames}</td><td>${money(base)}</td><td><b>${money(shiftPay(s))}</b></td></tr>`;
  }).join("");

  const w=window.open("","_blank");
  if(!w)return toast("Trình duyệt đang chặn cửa sổ in.");
  w.document.write(`<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Thống kê ${escPdf(jobInput)}</title><style>
  *{box-sizing:border-box}body{font-family:Arial,sans-serif;padding:24px;color:#111;background:#fff}h1{text-align:center;margin:0 0 8px}.subtitle{text-align:center;color:#555;margin-bottom:20px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}.summary-box{border:1px solid #ccc;border-radius:8px;padding:12px;text-align:center}.summary-box small{display:block;color:#666;margin-bottom:5px}.summary-box b{font-size:18px}table{width:100%;border-collapse:collapse;font-size:11px}th{background:#f1f1f1;font-weight:bold}th,td{border:1px solid #ccc;padding:7px 6px;vertical-align:middle}td small{display:block;color:#666;margin-top:2px}.total-row{background:#f5f5f5;font-weight:bold}@media print{body{padding:10px}button{display:none}}</style></head><body>
  <h1>THỐNG KÊ CÔNG VIỆC</h1><div class="subtitle">Công việc: <b>${escPdf(jobInput)}</b><br>Thời gian: ${escPdf(fromDate)} → ${escPdf(toDate)}</div>
  <div class="summary"><div class="summary-box"><small>Số ca</small><b>${list.length}</b></div><div class="summary-box"><small>Tổng giờ</small><b>${fmtHours(totalHours)}h</b></div><div class="summary-box"><small>Tổng phụ cấp</small><b>${money(totalExtraAmount)}</b></div><div class="summary-box"><small>Thực nhận</small><b>${money(totalActual)}</b></div></div>
  <table><thead><tr><th>#</th><th>Ngày</th><th>Công việc</th><th>Trạng thái</th><th>Ca làm</th><th>Số giờ</th><th>Lương/giờ</th><th>Phụ cấp</th><th>Chưa cộng</th><th>Thực nhận</th></tr></thead><tbody>${rows}<tr class="total-row"><td colspan="5">TỔNG CỘNG</td><td>${fmtHours(totalHours)}h</td><td></td><td>${money(totalExtraAmount)}</td><td>${money(totalBase)}</td><td>${money(totalActual)}</td></tr></tbody></table>
  <script>window.onload=function(){setTimeout(function(){window.print();},300);};<\/script></body></html>`);
  w.document.close();
}
async function clearData(){
  if(!confirm("Xóa TOÀN BỘ ca và vị trí trên thiết bị và tài khoản cloud? Hãy sao lưu trước nếu cần."))return;
  if(currentUser&&firestore){
    try{
      const snap=await firestore.collection("users").doc(currentUser.uid).collection("shifts").get();
      const docs=snap.docs;
      while(docs.length){const batch=firestore.batch();docs.splice(0,450).forEach(d=>batch.delete(d.ref));await batch.commit();}
      await userSettingsRef().delete().catch(()=>{});
    }catch(e){console.error(e);toast("Không xóa hết cloud; dữ liệu trên máy vẫn sẽ được xóa.");}
  }
  db=emptyDB();saveDB();toast("Đã xóa dữ liệu.");render();
}
function setGithub(){const current=localStorage.getItem("xmhtcv.github")||"";const u=prompt("Nhập URL GitHub Pages của bạn:",current);if(u===null)return;if(!/^https?:\/\//i.test(u))return toast("URL phải bắt đầu bằng http:// hoặc https://");localStorage.setItem("xmhtcv.github",u);window.open(u,"_blank","noopener");}
async function createAccount(){
  if(!auth)return toast("Firebase chưa được cấu hình.");
  const email=document.querySelector("#authEmail")?.value.trim();
  const password=document.querySelector("#authPassword")?.value||"";
  const password2=document.querySelector("#authPassword2")?.value||"";
  if(!email||password.length<6)return toast("Nhập email và mật khẩu ít nhất 6 ký tự.");
  if(password!==password2)return toast("Mật khẩu xác nhận không khớp.");
  try{
    const cred=await auth.createUserWithEmailAndPassword(email,password);
    currentUser=cred.user;
    await loadCloudForUser(currentUser);
    toast("✅ Tạo tài khoản thành công.");
  }catch(e){toast(e.message||"Không tạo được tài khoản.");}
}
async function login(){
  if(!auth)return toast("Firebase chưa được cấu hình.");
  const email=document.querySelector("#authEmail")?.value.trim();
  const password=document.querySelector("#authPassword")?.value||"";
  if(!email||!password)return toast("Nhập email và mật khẩu.");
  try{
    const cred=await auth.signInWithEmailAndPassword(email,password);
    currentUser=cred.user;
    await loadCloudForUser(currentUser);
  }catch(e){toast(e.message||"Đăng nhập thất bại.");}
}
async function sendResetPassword(){
  if(!auth)return toast("Firebase chưa được cấu hình.");
  const email=document.querySelector("#authEmail")?.value.trim();
  if(!email)return toast("Nhập email trước.");
  try{await auth.sendPasswordResetEmail(email);toast("📧 Đã gửi email đặt lại mật khẩu.");}
  catch(e){toast(e.message||"Không gửi được email.");}
}
async function changePassword(){
  if(!currentUser)return;
  const p=document.querySelector("#newPassword")?.value||"";
  if(p.length<6)return toast("Mật khẩu mới phải có ít nhất 6 ký tự.");
  try{await currentUser.updatePassword(p);toast("🔐 Đã đổi mật khẩu.");}
  catch(e){toast("Không đổi được mật khẩu. Nếu Firebase yêu cầu đăng nhập lại, hãy đăng xuất → đăng nhập → thử lại.");}
}
async function logout(){
  try{ if(currentUser) saveDB(); if(auth) await auth.signOut(); }catch(e){console.error(e);}
  currentUser=null;activeLocalKey="guest";db=loadDB("guest");state.route="account";toast("🚪 Đã đăng xuất.");render();
}

function openDrawer(){document.querySelector("#drawer").classList.add("open");document.querySelector("#backdrop").classList.add("show");document.querySelector("#drawer").setAttribute("aria-hidden","false");document.querySelector("#drawerNav").innerHTML=MENU.map(([r,ico,t,d])=>`<button data-drawer-route="${r}">${ico} ${t}</button>`).join("");document.querySelectorAll("[data-drawer-route]").forEach(b=>b.onclick=()=>{setRoute(b.dataset.drawerRoute);closeDrawer();});}
function closeDrawer(){document.querySelector("#drawer").classList.remove("open");document.querySelector("#backdrop").classList.remove("show");}
document.querySelector("#menuBtn").onclick=openDrawer;document.querySelector("#closeMenu").onclick=closeDrawer;document.querySelector("#backdrop").onclick=closeDrawer;
document.querySelector("#accountBtn").onclick=()=>setRoute("account");
document.querySelector("#bottomNav").addEventListener("click",e=>{const b=e.target.closest("button[data-route]");if(!b)return;setRoute(b.dataset.route==="menu"?"menu":b.dataset.route);});
render();
initCloud();
})();
</script>
</body>
</html>
